# Checks every pull request (including Dependabot security PRs) and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx --yes pnpm@10.28.0 install --frozen-lockfile
      - name: Lint
        run: npx --yes pnpm@10.28.0 lint
      - name: Unit tests
        run: npx --yes pnpm@10.28.0 test
